name: Verify brand system

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: brand-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-brand-system
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify React exports
        run: npm run verify:react

      - name: Verify logo surface modes
        run: npm run verify:logo-modes

      - name: Verify ecosystem registry and generated assets
        run: npm run verify:ecosystem
