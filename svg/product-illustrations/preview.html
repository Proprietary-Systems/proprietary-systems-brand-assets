<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proprietary Systems Product Illustrations</title>
    <style>
      :root { color-scheme: light; font-family: "Avenir Next", Avenir, Montserrat, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6fbfb; color: #0a2030; }
      main { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 52px 0 72px; }
      header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 54px); letter-spacing: -0.045em; }
      p { margin: 8px 0 0; color: #507080; }
      .swatches { display: flex; gap: 8px; }
      .swatches i { width: 28px; height: 28px; border: 1px solid rgba(10,32,48,.12); border-radius: 10px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
      article { overflow: hidden; border: 1px solid #d3e6e6; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px rgba(10,32,48,.07); }
      article img { display: block; width: 100%; aspect-ratio: 4/3; padding: 14px; background: radial-gradient(circle at 50% 42%, #f6fbfb 0 45%, #e6f2f2 100%); }
      article div { display: flex; justify-content: space-between; gap: 12px; padding: 15px 18px 17px; border-top: 1px solid #e6f2f2; }
      strong { font-size: 14px; }
      code { color: #68818d; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Product illustration system</h1>
          <p>Sixteen coordinated native SVG scenes for Proprietary Systems.</p>
        </div>
        <div class="swatches" aria-label="Brand palette">
          <i style="background:#0A2030"></i><i style="background:#0097A7"></i><i style="background:#00E5C2"></i><i style="background:#E6F2F2"></i><i style="background:#F6FBFB"></i>
        </div>
      </header>
      <section class="grid" id="grid"></section>
    </main>
    <script>
      fetch("manifest.json")
        .then((response) => response.json())
        .then(({ assets }) => {
          document.querySelector("#grid").innerHTML = assets.map((asset) => `
            <article>
              <img src="${asset.file}" alt="${asset.label} illustration" />
              <div><strong>${asset.label}</strong><code>${asset.file}</code></div>
            </article>
          `).join("");
        });
    </script>
  </body>
</html>
