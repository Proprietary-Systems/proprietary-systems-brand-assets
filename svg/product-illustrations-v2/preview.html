<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS Product Dioramas</title>
<style>:root{font-family:"Avenir Next",Avenir,Arial,sans-serif;color:#0a2030;background:#f6fbfb}*{box-sizing:border-box}body{margin:0}main{width:min(1440px,calc(100% - 40px));margin:auto;padding:48px 0 72px}h1{font-size:clamp(34px,5vw,60px);letter-spacing:-.05em;margin:0}p{color:#52717d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:30px}article{background:white;border:1px solid #d4e6e6;border-radius:24px;overflow:hidden;box-shadow:0 18px 55px rgba(10,32,48,.07)}img{display:block;width:100%;aspect-ratio:4/3;padding:10px;background:radial-gradient(circle at 50% 48%,#fff 0,#f6fbfb 54%,#e6f2f2 100%)}article div{padding:15px 18px;border-top:1px solid #e6f2f2;display:flex;justify-content:space-between;gap:8px}code{font-size:11px;color:#69818b}</style></head>
<body><main><h1>Product dioramas</h1><p>Native SVG v2 · shallow 3D · product-specific silhouettes</p><section class="grid" id="grid"></section></main>
<script>fetch('manifest.json').then(r=>r.json()).then(({assets})=>grid.innerHTML=assets.map(a=>`<article><img src="${a.file}" alt="${a.label} illustration"><div><strong>${a.label}</strong><code>${a.file}</code></div></article>`).join(''))</script></body></html>
